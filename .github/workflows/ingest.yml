name: Vacancy ingest pipeline

on:
  # Automated collection is switched off (vacancies are added by hand) — the
  # schedule is removed and the endpoint returns 403 unless the app has
  # SCRAPING_ENABLED=true. To turn it back on, set that and restore:
  #   schedule:
  #     - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call the ingest endpoint
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.INGEST_URL }}"
